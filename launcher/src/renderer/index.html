<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src data:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>LiquidLaunch</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="top">
      <div id="tabs">
        <button data-view="apps" class="active">Apps</button>
        <button data-view="widgets">Widgets</button>
      </div>
      <input id="search" type="text" placeholder="Search" autocomplete="off" spellcheck="false" />
    </div>

    <section id="view-apps">
      <div id="pages"></div>
      <div id="dots"></div>
    </section>

    <section id="view-widgets" hidden>
      <div id="widgets"></div>
    </section>
  </div>

  <div id="hint">Esc close · Ctrl+Alt+Space summon · Ctrl+Alt+Q quit · scroll / ← → to page</div>
  <script src="renderer.js"></script>
</body>
</html>
