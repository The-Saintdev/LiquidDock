<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src data:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>LiquidHome</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="bg"></div>
  <div id="scrim"></div>

  <div id="home">
    <header id="bar">
      <div id="clock">
        <div class="time">--:--</div>
        <div class="date">—</div>
      </div>
      <div id="searchwrap">
        <input id="search" type="text" placeholder="Search apps" autocomplete="off" spellcheck="false" />
      </div>
      <div id="actions">
        <button id="bg-toggle" title="Switch background">◐</button>
        <button id="min" title="Minimize">—</button>
        <button id="quit" title="Quit LiquidHome">⏻</button>
      </div>
    </header>

    <section id="widgets">
      <div class="card weather">
        <h3>Weather</h3>
        <div class="weather-row"><span class="weather-emoji">…</span><span class="weather-temp">--°</span></div>
        <div class="weather-city">Locating…</div>
      </div>
      <div class="card system">
        <h3>System</h3>
        <div class="stat"><div class="stat-label"><span>CPU</span><span class="cpu-val">–</span></div><div class="bar"><i class="cpu-bar"></i></div></div>
        <div class="stat"><div class="stat-label"><span>Memory</span><span class="mem-val">–</span></div><div class="bar"><i class="mem-bar"></i></div></div>
        <div class="stat"><div class="stat-label"><span>Battery</span><span class="bat-val">–</span></div><div class="bar"><i class="bat-bar"></i></div></div>
      </div>
      <div class="card calendar">
        <h3 class="cal-title">Calendar</h3>
        <div class="cal-grid"></div>
      </div>
    </section>

    <section id="apps">
      <div id="pages"></div>
      <div id="dots"></div>
    </section>
  </div>

  <script src="home.js"></script>
</body>
</html>
