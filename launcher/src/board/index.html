<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>LiquidBoard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="board">
    <div class="card clock">
      <div class="clock-time">--:--</div>
      <div class="clock-date"></div>
    </div>
    <div class="card weather">
      <h3>Weather</h3>
      <div class="weather-row"><span class="weather-emoji">…</span><span class="weather-temp">--°</span></div>
      <div class="weather-city">Locating…</div>
    </div>
    <div class="card system">
      <h3>System</h3>
      <div class="stat"><div class="stat-label"><span>CPU</span><span class="cpu-val">–</span></div><div class="bar"><i class="cpu-bar"></i></div></div>
      <div class="stat"><div class="stat-label"><span>Memory</span><span class="mem-val">–</span></div><div class="bar"><i class="mem-bar"></i></div></div>
      <div class="stat"><div class="stat-label"><span>Battery</span><span class="bat-val">–</span></div><div class="bar"><i class="bat-bar"></i></div></div>
    </div>
    <div class="card calendar">
      <h3 class="cal-title">Calendar</h3>
      <div class="cal-grid"></div>
    </div>
  </div>
  <script src="board.js"></script>
</body>
</html>
